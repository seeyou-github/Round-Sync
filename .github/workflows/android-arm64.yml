name: Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read Go version
        id: go-version
        shell: bash
        run: |
          GO_VERSION="$(grep -E '^de\.felixnuesse\.extract\.goVersion=' gradle.properties | cut -d'=' -f2)"
          echo "value=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.value }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION="$(grep -E '^de\.felixnuesse\.extract\.ndkVersion=' gradle.properties | cut -d'=' -f2)"
          yes | sdkmanager --licenses
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Build OSS release APK
        run: ./gradlew assembleOssRelease

      - name: Collect arm64-v8a APK
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk')"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a-apk
          path: dist/*.apk
          if-no-files-found: error
